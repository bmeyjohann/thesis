# Project-scoped Codex config intended to be safe to commit.
# Keep secrets and machine-specific credentials in ~/.codex/config.toml or the environment.
#
# Intentionally do not define local stdio MCP launchers here. Codex Desktop currently does not
# reliably spawn MCP servers in the workspace cwd, so relative commands like `bash scripts/...`
# can fail during startup. Keep local MCP wiring in ~/.codex/config.toml with absolute paths.

[mcp_servers.linear]
url = "https://mcp.linear.app/mcp"
